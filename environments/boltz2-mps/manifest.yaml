scientific_boundary:
  maturity: experimental
  comparison_required: official-cuda-reference
  observations:
    - With CPU fallback enabled, operations unsupported on MPS run on CPU, so the profile
      executes on a mix of MPS and CPU.
    - A technical smoke verifies that the runtime executes. Structure, pose and affinity
      accuracy require comparison with the official CUDA reference (`comparison_required`).
    - The two-step profile emitted impossible geometry on one opened PLINDER
      validation system. The matched normal-step profile removed that
      catastrophic pathology but retained a protein-distance physical failure;
      this supports schedule sensitivity.
    - The profile installs source from the open upstream pull request 527 on the Boltz 2.2.1
      release.
    - The environment installs filelock 4.2.4 and hydra-core 1.3.6, and hydra-core 1.3.6 replaces the
      `==1.3.2` requirement of Boltz 2.2.1; the Apple GPU case of
      `tests/core/test_structure_predict_biomolecular_complex.py` passed in this environment on 2026-10-25.
