name: alambiq-openff-complex-preparation-v1
channels:
- conda-forge
dependencies:
- python=3.12
- openff-toolkit-base=0.19.0
- openff-interchange-base=0.5.5
- openff-nagl=0.5.5
# Charge inference runs on CPU; OpenMM selects its own dynamics platform.
- pytorch=*=cpu*
- openff-nagl-models=2025.09.0
- openff-forcefields=2026.09.0
- openmm=8.6.0
- pdbfixer=1.12.0
- rdkit=2026.03.1
- gemmi=0.7.5
- parmed=4.3.1
- tinydb
- lxml
- validators
- pip
- setuptools>=77.0.3
- setuptools-scm>=8
- wheel
