id: ensemble-vs-nmr
steps:
  - id: prepare
    capability: structure.prepare_protein_system
    params:
      structure: 1P7E.cif
      chain_id: A
      solvent: gbn2
      ph: 7.0
      ionic_strength_molar: 0.05
      source_component_policy: selected-chain-only

  - id: replica-1
    capability: simulation.run_molecular_dynamics
    bind:
      system: prepare.system_xml
      state: prepare.state_xml
      topology: prepare.topology_pdb
    params:
      ensemble: implicit
      temperature_kelvin: 298.0
      thermalize_ps: 10
      readiness_window_ps: 0
      production_ps: 20
      report_interval: 100
      seed: 37309

  - id: replica-2
    capability: simulation.run_molecular_dynamics
    bind:
      system: prepare.system_xml
      state: prepare.state_xml
      topology: prepare.topology_pdb
    params:
      ensemble: implicit
      temperature_kelvin: 298.0
      thermalize_ps: 10
      readiness_window_ps: 0
      production_ps: 20
      report_interval: 100
      seed: 37329

  - id: replica-3
    capability: simulation.run_molecular_dynamics
    bind:
      system: prepare.system_xml
      state: prepare.state_xml
      topology: prepare.topology_pdb
    params:
      ensemble: implicit
      temperature_kelvin: 298.0
      thermalize_ps: 10
      readiness_window_ps: 0
      production_ps: 20
      report_interval: 100
      seed: 37349

  - id: couplings
    capability: simulation.compare_scalar_couplings
    bind:
      topology: prepare.topology_pdb
      replicas.0.segments.0.trajectory: replica-1.trajectory
      replicas.0.segments.0.state_data: replica-1.state_data
      replicas.1.segments.0.trajectory: replica-2.trajectory
      replicas.1.segments.0.state_data: replica-2.state_data
      replicas.2.segments.0.trajectory: replica-3.trajectory
      replicas.2.segments.0.state_data: replica-3.state_data
    params:
      replicas:
        - {id: replica-1, segments: [{}]}
        - {id: replica-2, segments: [{}]}
        - {id: replica-3, segments: [{}]}
      atom_naming: iupac-beta-methylene
      reference:
        title: GB3 primary three-bond scalar couplings
        citation: "Vögeli et al. (2015), DOI 10.1016/j.dib.2015.08.020"
        license: CC-BY-4.0
        temperature_kelvin: 298.0
        conditions: "2–4 mM GB3 in 50 mM potassium phosphate, pH 6.5–7.0, 97/3 or 95/5 H2O/D2O, 0.5 mg/mL sodium azide; source-specific measurements at 298 K"
        observations:
          - {id: gb3-cco-001, atoms: [{chain_id: A, residue_number: 3, residue_name: TYR, atom_name: H}, {chain_id: A, residue_number: 3, residue_name: TYR, atom_name: HA}], karplus: {a_hz: 8.754, b_hz: -1.222, c_hz: 0.111}, measured_hz: 9.77, reported_error_hz: 0.24, error_description: "Column 8 of the primary GB3.cco file"}
          - {id: gb3-cco-002, atoms: [{chain_id: A, residue_number: 3, residue_name: TYR, atom_name: H}, {chain_id: A, residue_number: 3, residue_name: TYR, atom_name: CB}], karplus: {a_hz: 3.693, b_hz: -0.514, c_hz: 0.043}, measured_hz: 0.74, reported_error_hz: 0.09, error_description: "Column 8 of the primary GB3.cco file"}
