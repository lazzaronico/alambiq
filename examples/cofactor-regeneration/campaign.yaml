id: cofactor-regeneration
steps:
  - id: without
    capability: operation.simulate
    params:
      definition: without-regeneration.json

  - id: with
    capability: operation.simulate
    params:
      definition: with-regeneration.json

  - id: without-output
    capability: operation.summarize
    bind:
      operation: without.record
